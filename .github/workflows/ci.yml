name: CI

# Every push and pull request: the whole test suite on the platforms people use, and the frozen
# data checked on its own. Nothing here needs a secret, and the token is read-only.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests, ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run every test
        run: node --test "test/**/*.test.mjs"

  data:
    name: The frozen data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify every day, the chain, the rules and the privacy scan
        run: node scripts/verify.mjs --all
      - name: Rebuild the derived standings and compare byte for byte
        run: node scripts/rank.mjs --check
      - name: Since the previous push, results may only gain files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify.mjs --ci --base "$BASE"
      - name: Scan every commit ever made for private data and secrets
        run: node scripts/verify.mjs --history
